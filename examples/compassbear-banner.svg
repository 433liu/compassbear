<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CompassBear — claim-first research workflow built from real manuscript revision workflows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0e1c31"/>
    </linearGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="panelclip"><rect x="8" y="8" width="1184" height="384" rx="22"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
      .serif{font-family:Georgia,"Times New Roman","Songti SC",serif;}
      .mono{font-family:ui-monospace,"SF Mono","Cascadia Code","Consolas","Liberation Mono",monospace;}
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="384" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#panelclip)">
    <rect x="8" y="8" width="1184" height="384" fill="url(#grid)"/>
    <ellipse cx="210" cy="96" rx="300" ry="220" fill="url(#glowO)"/>
  </g>
  <rect x="8" y="8" width="1184" height="384" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <circle cx="96" cy="80" r="26" fill="none" stroke="#5b7d9a" stroke-width="2"/>
  <circle cx="96" cy="80" r="18" fill="none" stroke="#5b7d9a" stroke-opacity="0.35" stroke-width="1"/>
  <polygon points="96,57 92,80 100,80" fill="#f97316"/>
  <polygon points="96,103 92,80 100,80" fill="#5b7d9a"/>
  <circle cx="96" cy="80" r="3" fill="#eef3f9"/>

  <text x="140" y="86" class="sans" font-size="36" font-weight="700" letter-spacing="0.4" fill="#eef3f9">CompassBear</text>
  <text x="141" y="108" class="mono" font-size="12.5" letter-spacing="2" fill="#8ea3bd">CLAIM-FIRST RESEARCH WORKFLOW · CLAUDE CODE / CODEX</text>

  <rect x="1032" y="66" width="120" height="30" rx="15" fill="none" stroke="#2b4660" stroke-width="1"/>
  <text x="1092" y="85" text-anchor="middle" class="mono" font-size="12" letter-spacing="0.5" fill="#7f93ad">v0.5.18 · MIT</text>

  <rect x="78" y="146" width="4" height="58" rx="2" fill="#f97316"/>
  <text x="98" y="183" class="serif" font-size="23" font-style="italic" fill="#e8eef6">What must the reader believe &#8212; and what evidence makes that belief unavoidable?</text>

  <g stroke="#5b7d9a" stroke-width="1.5" fill="none">
    <path d="M168 273 H178"/><path d="M178 273 l-5 -4 M178 273 l-5 4"/>
    <path d="M310 273 H320"/><path d="M320 273 l-5 -4 M320 273 l-5 4"/>
    <path d="M452 273 H462"/><path d="M462 273 l-5 -4 M462 273 l-5 4"/>
    <path d="M594 273 H604"/><path d="M604 273 l-5 -4 M604 273 l-5 4"/>
    <path d="M736 273 H746"/><path d="M746 273 l-5 -4 M746 273 l-5 4"/>
    <path d="M878 273 H888"/><path d="M888 273 l-5 -4 M888 273 l-5 4"/>
    <path d="M1020 273 H1030"/><path d="M1030 273 l-5 -4 M1030 273 l-5 4"/>
  </g>

  <g>
    <rect x="39" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="103" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Figures</text>

    <rect x="181" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="245" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Data</text>

    <rect x="323" y="250" width="128" height="46" rx="10" fill="#f97316" filter="url(#soft)" opacity="0.55"/>
    <rect x="323" y="250" width="128" height="46" rx="10" fill="#f97316"/>
    <text x="397" y="245" text-anchor="middle" class="mono" font-size="11" letter-spacing="0.5" fill="#f9a86a">&#9733; THE CORE</text>
    <text x="387" y="278" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0a1120">Claim hierarchy</text>

    <rect x="465" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="529" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Draft</text>

    <rect x="607" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="671" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Audit</text>

    <rect x="749" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="813" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Cover letter</text>

    <rect x="891" y="250" width="128" height="46" rx="10" fill="#14243d" stroke="#2b4660"/>
    <text x="955" y="278" text-anchor="middle" class="mono" font-size="12" fill="#cdd8e6">Journal fit</text>

    <rect x="1033" y="250" width="128" height="46" rx="10" fill="#f97316" fill-opacity="0.10" stroke="#f97316" stroke-width="1.5"/>
    <text x="1097" y="278" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#f9a86a">Submit</text>
  </g>

  <text x="600" y="324" text-anchor="middle" class="mono" font-size="12.5" letter-spacing="0.4" fill="#7f93ad">claim-first &#8212; every step exists to make the central claim harder to attack</text>

  <line x1="48" y1="350" x2="1152" y2="350" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <text x="48" y="374" class="mono" font-size="11" letter-spacing="1.4" fill="#7f93ad">BUILT FROM REAL MANUSCRIPT REVISION WORKFLOWS &#183; END TO END</text>
  <text x="1152" y="374" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#7f93ad">BUILT FOR MATERIALS &amp; CHEMISTRY</text>
</svg>
